<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1420" viewBox="0 0 2000 1420" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#555"/></marker></defs>
<rect width="2000" height="1420" fill="#FFFFFF"/>
<text x="560" y="62" font-size="28" font-weight="700" fill="#111">DyoSnap: component diagram (C4 level 3)</text>
<text x="560" y="94" font-size="15" fill="#444">One code base and one UI (egui/eframe on OpenGL) on macOS and Linux. Only the platform layer differs per system.</text>
<circle cx="370" cy="42" r="24" fill="#08427B"/>
<rect x="260" y="62" width="220" height="80" rx="26" fill="#08427B" stroke="#073B6F" stroke-width="1.5"/>
<text x="370.0" y="90" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">User</text>
<text x="370.0" y="110" text-anchor="middle" font-size="12.5" fill="#FFFFFF" opacity="0.85">[Person]</text>
<rect x="20" y="180" width="1640" height="1055" rx="6" fill="none" stroke="#777" stroke-width="1.6" stroke-dasharray="10 6"/>
<text x="40" y="1205" font-size="17" font-weight="700" fill="#333">DyoSnap</text>
<text x="40" y="1225" font-size="13" fill="#555">[Container: desktop app, one process. Rust, egui/eframe + OpenGL]</text>
<rect x="80" y="220" width="580" height="125" rx="10" fill="#85BBF0" stroke="#5D82A8" stroke-width="1.5"/>
<text x="370.0" y="248" text-anchor="middle" font-size="17" font-weight="700" fill="#0B2545">Main window &amp; control</text>
<text x="370.0" y="268" text-anchor="middle" font-size="12.5" fill="#0B2545" opacity="0.85">[Component: egui · app/ (mod, frame, window, events, views, theme), icons.rs]</text>
<text x="370.0" y="292" text-anchor="middle" font-size="13.5" fill="#0B2545">Main window, start page, bars. Handles the tray menu and</text>
<text x="370.0" y="311" text-anchor="middle" font-size="13.5" fill="#0B2545">global shortcuts, runs the screenshot and recording flow.</text>
<text x="370.0" y="330" text-anchor="middle" font-size="13.5" fill="#0B2545">Linux: app/linux.rs keeps the state while the window is gone.</text>
<rect x="760" y="220" width="300" height="125" rx="10" fill="#85BBF0" stroke="#5D82A8" stroke-width="1.5"/>
<text x="910.0" y="248" text-anchor="middle" font-size="17" font-weight="700" fill="#0B2545">Settings window</text>
<text x="910.0" y="268" text-anchor="middle" font-size="12.5" fill="#0B2545" opacity="0.85">[Component: egui · prefs.rs, about.rs]</text>
<text x="910.0" y="292" text-anchor="middle" font-size="13.5" fill="#0B2545">Own window with General,</text>
<text x="910.0" y="311" text-anchor="middle" font-size="13.5" fill="#0B2545">Advanced, Hotkeys and About tabs.</text>
<rect x="1160" y="220" width="300" height="125" rx="10" fill="#85BBF0" stroke="#5D82A8" stroke-width="1.5"/>
<text x="1310.0" y="248" text-anchor="middle" font-size="17" font-weight="700" fill="#0B2545">Settings</text>
<text x="1310.0" y="268" text-anchor="middle" font-size="12.5" fill="#0B2545" opacity="0.85">[Component: serde_json · settings.rs]</text>
<text x="1310.0" y="292" text-anchor="middle" font-size="13.5" fill="#0B2545">User settings in a small JSON file,</text>
<text x="1310.0" y="311" text-anchor="middle" font-size="13.5" fill="#0B2545">read by almost every component.</text>
<path d="M 660 282 L 758 282" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="709" y="272" text-anchor="middle" font-size="12.5" fill="#333">opens</text>
<path d="M 1060 282 L 1158 282" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="1109" y="272" text-anchor="middle" font-size="12.5" fill="#333">changes</text>
<path d="M 370 142 L 370 218" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="382" y="166" text-anchor="start" font-size="12.5" fill="#333">uses tray, shortcuts, windows</text>
<rect x="80" y="435" width="285" height="130" rx="10" fill="#85BBF0" stroke="#5D82A8" stroke-width="1.5"/>
<text x="222.5" y="463" text-anchor="middle" font-size="17" font-weight="700" fill="#0B2545">Capture flow</text>
<text x="222.5" y="483" text-anchor="middle" font-size="12.5" fill="#0B2545" opacity="0.85">[Component: egui · app/capture/]</text>
<text x="222.5" y="507" text-anchor="middle" font-size="13.5" fill="#0B2545">Screenshot jobs, choosing the</text>
<text x="222.5" y="526" text-anchor="middle" font-size="13.5" fill="#0B2545">record area, overlays and the</text>
<text x="222.5" y="545" text-anchor="middle" font-size="13.5" fill="#0B2545">recording bar (recbar.rs).</text>
<rect x="395" y="435" width="285" height="130" rx="10" fill="#85BBF0" stroke="#5D82A8" stroke-width="1.5"/>
<text x="537.5" y="463" text-anchor="middle" font-size="17" font-weight="700" fill="#0B2545">Files</text>
<text x="537.5" y="483" text-anchor="middle" font-size="12.5" fill="#0B2545" opacity="0.85">[Component: Rust · app/files.rs]</text>
<text x="537.5" y="507" text-anchor="middle" font-size="13.5" fill="#0B2545">Opens, saves and copies</text>
<text x="537.5" y="526" text-anchor="middle" font-size="13.5" fill="#0B2545">pictures and videos (local,</text>
<text x="537.5" y="545" text-anchor="middle" font-size="13.5" fill="#0B2545">no network).</text>
<rect x="710" y="435" width="285" height="130" rx="10" fill="#85BBF0" stroke="#5D82A8" stroke-width="1.5"/>
<text x="852.5" y="463" text-anchor="middle" font-size="17" font-weight="700" fill="#0B2545">Image editor</text>
<text x="852.5" y="483" text-anchor="middle" font-size="12.5" fill="#0B2545" opacity="0.85">[Component: egui · editor.rs]</text>
<text x="852.5" y="507" text-anchor="middle" font-size="13.5" fill="#0B2545">Canvas: draw, select, move,</text>
<text x="852.5" y="526" text-anchor="middle" font-size="13.5" fill="#0B2545">type text, crop.</text>
<rect x="1025" y="435" width="285" height="130" rx="10" fill="#85BBF0" stroke="#5D82A8" stroke-width="1.5"/>
<text x="1167.5" y="463" text-anchor="middle" font-size="17" font-weight="700" fill="#0B2545">Video trimmer</text>
<text x="1167.5" y="483" text-anchor="middle" font-size="12.5" fill="#0B2545" opacity="0.85">[Component: egui · video.rs]</text>
<text x="1167.5" y="507" text-anchor="middle" font-size="13.5" fill="#0B2545">Preview after recording,</text>
<text x="1167.5" y="526" text-anchor="middle" font-size="13.5" fill="#0B2545">pick start and end on the</text>
<text x="1167.5" y="545" text-anchor="middle" font-size="13.5" fill="#0B2545">timeline, then save.</text>
<rect x="1340" y="435" width="285" height="130" rx="10" fill="#85BBF0" stroke="#5D82A8" stroke-width="1.5"/>
<text x="1482.5" y="463" text-anchor="middle" font-size="17" font-weight="700" fill="#0B2545">Screen recording</text>
<text x="1482.5" y="483" text-anchor="middle" font-size="12.5" fill="#0B2545" opacity="0.85">[Component: Rust · record.rs]</text>
<text x="1482.5" y="507" text-anchor="middle" font-size="13.5" fill="#0B2545">Starts and stops recording in</text>
<text x="1482.5" y="526" text-anchor="middle" font-size="13.5" fill="#0B2545">a separate process. The app</text>
<text x="1482.5" y="545" text-anchor="middle" font-size="13.5" fill="#0B2545">only shows a timer.</text>
<path d="M 370 345 L 370 395" fill="none" stroke="#555" stroke-width="1.6"/>
<path d="M 222.5 395 L 1482.5 395" fill="none" stroke="#555" stroke-width="1.6"/>
<text x="382" y="378" font-size="12.5" fill="#333">controls</text>
<path d="M 222.5 395 L 222.5 433" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
<path d="M 537.5 395 L 537.5 433" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
<path d="M 852.5 395 L 852.5 433" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
<path d="M 1167.5 395 L 1167.5 433" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
<path d="M 1482.5 395 L 1482.5 433" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="470" y="660" width="480" height="120" rx="10" fill="#85BBF0" stroke="#5D82A8" stroke-width="1.5"/>
<text x="710.0" y="688" text-anchor="middle" font-size="17" font-weight="700" fill="#0B2545">Image document</text>
<text x="710.0" y="708" text-anchor="middle" font-size="12.5" fill="#0B2545" opacity="0.85">[Component: tiny-skia, ab_glyph · doc.rs]</text>
<text x="710.0" y="732" text-anchor="middle" font-size="13.5" fill="#0B2545">Base image plus a list of editable shapes. Renders the</text>
<text x="710.0" y="751" text-anchor="middle" font-size="13.5" fill="#0B2545">final picture with tiny-skia, only when it changes.</text>
<path d="M 537.5 565 L 537.5 658" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="547.5" y="615" text-anchor="start" font-size="12.5" fill="#333">loads, exports</text>
<path d="M 852.5 565 L 852.5 658" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="862.5" y="615" text-anchor="start" font-size="12.5" fill="#333">edits shapes</text>
<rect x="80" y="850" width="1545" height="320" rx="10" fill="#C9DEF5" stroke="#5D82A8" stroke-width="1.5"/>
<text x="100" y="878" font-size="17" font-weight="700" fill="#0B2545">Platform layer</text>
<text x="232" y="878" font-size="12.5" fill="#0B2545" opacity="0.85">[Component: Rust · platform/mod.rs]</text>
<text x="100" y="900" font-size="13.5" fill="#0B2545">The same functions on both systems: screenshots, clipboard, screens, tray, shortcuts, recording, opening files, notifications, launch at login. Picked with cfg(target_os) at compile time.</text>
<rect x="100" y="915" width="745" height="240" rx="10" fill="#DCEBFA" stroke="#5D82A8" stroke-width="1.5"/>
<text x="116" y="943" text-anchor="start" font-size="17" font-weight="700" fill="#0B2545">macOS implementation</text>
<text x="116" y="963" text-anchor="start" font-size="12.5" fill="#0B2545" opacity="0.85">[Component: Rust · platform/macos/]</text>
<text x="116" y="987" text-anchor="start" font-size="13.5" fill="#0B2545">Tray &amp; shortcuts: tray-icon, global-hotkey</text>
<text x="116" y="1006" text-anchor="start" font-size="13.5" fill="#0B2545">Screenshots: screencapture (child process)</text>
<text x="116" y="1025" text-anchor="start" font-size="13.5" fill="#0B2545">Area picker: in-process picture with ScreenCaptureKit</text>
<text x="116" y="1044" text-anchor="start" font-size="13.5" fill="#0B2545">Clipboard: NSPasteboard (objc2)</text>
<text x="116" y="1063" text-anchor="start" font-size="13.5" fill="#0B2545">Screens, mouse position: CoreGraphics</text>
<text x="116" y="1082" text-anchor="start" font-size="13.5" fill="#0B2545">Recording: ffmpeg with AVFoundation, else screencapture -v</text>
<text x="116" y="1101" text-anchor="start" font-size="13.5" fill="#0B2545">Notifications: UserNotifications · Open files: open</text>
<text x="116" y="1120" text-anchor="start" font-size="13.5" fill="#0B2545">Permissions: reads the Privacy &amp; Security state, no prompt</text>
<rect x="860" y="915" width="745" height="240" rx="10" fill="#DCEBFA" stroke="#5D82A8" stroke-width="1.5"/>
<text x="876" y="943" text-anchor="start" font-size="17" font-weight="700" fill="#0B2545">Linux implementation (Wayland only)</text>
<text x="876" y="963" text-anchor="start" font-size="12.5" fill="#0B2545" opacity="0.85">[Component: Rust · platform/linux/]</text>
<text x="876" y="987" text-anchor="start" font-size="13.5" fill="#0B2545">Tray: ksni (StatusNotifierItem over D-Bus)</text>
<text x="876" y="1006" text-anchor="start" font-size="13.5" fill="#0B2545">Shortcuts, screencast: xdg-desktop-portal (ashpd)</text>
<text x="876" y="1025" text-anchor="start" font-size="13.5" fill="#0B2545">Screenshots: Screenshot portal · Area picker: frozen PipeWire picture</text>
<text x="876" y="1044" text-anchor="start" font-size="13.5" fill="#0B2545">Recording: PipeWire stream, fed to ffmpeg through a named pipe</text>
<text x="876" y="1063" text-anchor="start" font-size="13.5" fill="#0B2545">Record frame: wlr-layer-shell (not GNOME) · Raise: xdg-activation</text>
<text x="876" y="1082" text-anchor="start" font-size="13.5" fill="#0B2545">Clipboard: arboard, on GNOME plain Wayland (wl_data_device)</text>
<text x="876" y="1101" text-anchor="start" font-size="13.5" fill="#0B2545">Screens: Wayland (smithay-client-toolkit) · Windows: KWin script</text>
<text x="876" y="1120" text-anchor="start" font-size="13.5" fill="#0B2545">Window frame: winit Adwaita CSD · Open files: xdg-open, gio</text>
<text x="876" y="1139" text-anchor="start" font-size="13.5" fill="#0B2545">One instance: org.freedesktop.Application on the session bus</text>
<path d="M 222.5 565 L 222.5 848" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="232.5" y="715" text-anchor="start" font-size="12.5" fill="#333">screenshots, screens</text>
<path d="M 1482.5 565 L 1482.5 848" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="1492.5" y="715" text-anchor="start" font-size="12.5" fill="#333">screen source,</text>
<text x="1492.5" y="731" text-anchor="start" font-size="12.5" fill="#333">ffmpeg arguments</text>
<path d="M 80 300 L 48 300 L 48 980 L 78 980" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="38" y="640" text-anchor="middle" font-size="12.5" fill="#333" transform="rotate(-90 38 640)">tray, shortcuts, clipboard, permissions</text>
<rect x="1720" y="435" width="260" height="130" rx="10" fill="#438DD5" stroke="#3C7FC0" stroke-width="1.5"/>
<text x="1850.0" y="463" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">ffmpeg</text>
<text x="1850.0" y="483" text-anchor="middle" font-size="12.5" fill="#FFFFFF" opacity="0.85">[Container: child process]</text>
<text x="1850.0" y="507" text-anchor="middle" font-size="13.5" fill="#FFFFFF">Records, encodes, decodes.</text>
<text x="1850.0" y="526" text-anchor="middle" font-size="13.5" fill="#FFFFFF">macOS: bundled (LGPL)</text>
<text x="1850.0" y="545" text-anchor="middle" font-size="13.5" fill="#FFFFFF">Linux: from the system</text>
<path d="M 1625 500 L 1718 500" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="1667" y="490" text-anchor="start" font-size="12.5" fill="#333">starts</text>
<path d="M 1167.5 565 L 1167.5 615 L 1800 615 L 1800 567" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="1320" y="607" text-anchor="middle" font-size="12.5" fill="#333">starts for preview frames and export</text>
<path d="M 1605 1000 L 1930 1000 L 1930 567" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="1767" y="990" text-anchor="middle" font-size="12.5" fill="#333">raw video over a named pipe</text>
<rect x="1720" y="220" width="260" height="125" rx="10" fill="#999999" stroke="#6B6B6B" stroke-width="1.5"/>
<text x="1850.0" y="248" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">File system</text>
<text x="1850.0" y="268" text-anchor="middle" font-size="12.5" fill="#FFFFFF" opacity="0.85">[external]</text>
<text x="1850.0" y="292" text-anchor="middle" font-size="13.5" fill="#FFFFFF">settings.json, pictures, videos</text>
<path d="M 1460 282 L 1718 282" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="1560" y="272" text-anchor="middle" font-size="12.5" fill="#333">reads, writes settings.json</text>
<rect x="270" y="1285" width="400" height="125" rx="10" fill="#999999" stroke="#6B6B6B" stroke-width="1.5"/>
<text x="470.0" y="1313" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">macOS</text>
<text x="470.0" y="1333" text-anchor="middle" font-size="12.5" fill="#FFFFFF" opacity="0.85">[Software system]</text>
<text x="470.0" y="1357" text-anchor="middle" font-size="13.5" fill="#FFFFFF">AppKit, CoreGraphics, ScreenCaptureKit, AVFoundation,</text>
<text x="470.0" y="1376" text-anchor="middle" font-size="13.5" fill="#FFFFFF">UserNotifications, screencapture,</text>
<text x="470.0" y="1395" text-anchor="middle" font-size="13.5" fill="#FFFFFF">Screen Recording permission</text>
<rect x="1032" y="1285" width="400" height="125" rx="10" fill="#999999" stroke="#6B6B6B" stroke-width="1.5"/>
<text x="1232.0" y="1313" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">Linux desktop (GNOME, KDE)</text>
<text x="1232.0" y="1333" text-anchor="middle" font-size="12.5" fill="#FFFFFF" opacity="0.85">[Software system]</text>
<text x="1232.0" y="1357" text-anchor="middle" font-size="13.5" fill="#FFFFFF">Wayland compositor, xdg-desktop-portal,</text>
<text x="1232.0" y="1376" text-anchor="middle" font-size="13.5" fill="#FFFFFF">PipeWire, D-Bus</text>
<path d="M 470 1155 L 470 1283" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="482" y="1260" text-anchor="start" font-size="12.5" fill="#333">system calls, child processes</text>
<path d="M 1232 1155 L 1232 1283" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="1244" y="1260" text-anchor="start" font-size="12.5" fill="#333">D-Bus, Wayland, PipeWire</text>
<text x="1720" y="1250" font-size="14" font-weight="700" fill="#333">Legend</text>
<rect x="1720" y="1264" width="26" height="18" rx="4" fill="#08427B" stroke="#666" stroke-width="0.8"/>
<text x="1756" y="1278" font-size="13" fill="#333">Person</text>
<rect x="1720" y="1290" width="26" height="18" rx="4" fill="#85BBF0" stroke="#666" stroke-width="0.8"/>
<text x="1756" y="1304" font-size="13" fill="#333">Component</text>
<rect x="1720" y="1316" width="26" height="18" rx="4" fill="#DCEBFA" stroke="#666" stroke-width="0.8"/>
<text x="1756" y="1330" font-size="13" fill="#333">Component, one per system</text>
<rect x="1720" y="1342" width="26" height="18" rx="4" fill="#438DD5" stroke="#666" stroke-width="0.8"/>
<text x="1756" y="1356" font-size="13" fill="#333">External container</text>
<rect x="1720" y="1368" width="26" height="18" rx="4" fill="#999999" stroke="#666" stroke-width="0.8"/>
<text x="1756" y="1382" font-size="13" fill="#333">External system</text>

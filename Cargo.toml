[package]
name = "dyosnap"
version = "1.4.0"
edition = "2024"
license = "MIT"
publish = false
description = "Screenshots and screen recordings, saved locally"
repository = "https://github.com/pschu13r/dyosnap"
authors = ["Philipp Schuler <76153816+pschu13r@users.noreply.github.com>"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.37"
log = "0.4"
epaint_default_fonts = "0.37"
winit = { version = "0.30.13", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
ab_glyph = "0.2"
rfd = { version = "0.18", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "7"
pollster = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "0.25", default-features = false }
global-hotkey = "0.10"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSGeometry", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem", "NSImageRep", "NSBitmapImageRep"] }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "wayland"] }
# GNOME draws no window frames for Wayland apps; this draws one that looks like GNOME's.
winit = { version = "0.30.13", default-features = false, features = ["wayland-csd-adwaita"] }
rfd = { version = "0.18", default-features = false, features = ["xdg-portal", "wayland"] }
ashpd = { version = "0.14", default-features = false, features = ["async-io", "screenshot", "screencast", "global_shortcuts"] }
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
zbus = { version = "6", default-features = false, features = ["default-rt"] }
arboard = { version = "3.7", default-features = false, features = ["image-data", "wayland-data-control"] }
smithay-client-toolkit = { version = "0.19", default-features = false }
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
futures-util = { version = "0.3", default-features = false }
pipewire = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Linux packages, built by scripts/bundle-linux.sh after the tarball (it writes the
# notices in dist/linux). The program finds ffmpeg on the system, so both depend on it.
# Both also install the DyoSnap apt/dnf repository and its signing key, so updates come
# with the system updates. linux/dyosnap-archive-keyring.asc is the repository's public key.

[package.metadata.deb]
section = "graphics"
license-file = ["LICENSE", "0"]
depends = "$auto, ffmpeg"
extended-description = """\
A light screenshot and screen-recording app for Wayland desktops (GNOME, KDE Plasma). \
It saves locally and copies every capture to the clipboard."""
assets = [
    ["target/release/dyosnap", "usr/bin/", "755"],
    ["linux/io.github.pschu13r.DyoSnap.desktop", "usr/share/applications/", "644"],
    ["linux/io.github.pschu13r.DyoSnap.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["linux/io.github.pschu13r.DyoSnap.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["linux/io.github.pschu13r.DyoSnap.metainfo.xml", "usr/share/metainfo/", "644"],
    # The DyoSnap apt repository, so updates come with apt upgrade (see scripts/update-repo.sh).
    ["linux/dyosnap.sources", "etc/apt/sources.list.d/", "644"],
    ["linux/dyosnap-archive-keyring.asc", "usr/share/keyrings/", "644"],
    ["dist/linux/THIRD_PARTY_NOTICES.txt", "usr/share/doc/dyosnap/", "644"],
]

[package.metadata.generate-rpm]
summary = "Screenshots and screen recordings, saved locally"
assets = [
    { source = "target/release/dyosnap", dest = "/usr/bin/dyosnap", mode = "755" },
    { source = "linux/io.github.pschu13r.DyoSnap.desktop", dest = "/usr/share/applications/io.github.pschu13r.DyoSnap.desktop", mode = "644" },
    { source = "linux/io.github.pschu13r.DyoSnap.png", dest = "/usr/share/icons/hicolor/256x256/apps/io.github.pschu13r.DyoSnap.png", mode = "644" },
    { source = "linux/io.github.pschu13r.DyoSnap.svg", dest = "/usr/share/icons/hicolor/scalable/apps/io.github.pschu13r.DyoSnap.svg", mode = "644" },
    { source = "linux/io.github.pschu13r.DyoSnap.metainfo.xml", dest = "/usr/share/metainfo/io.github.pschu13r.DyoSnap.metainfo.xml", mode = "644" },
    # The DyoSnap dnf repository, so updates come with dnf upgrade (see scripts/update-repo.sh).
    { source = "linux/dyosnap.repo", dest = "/etc/yum.repos.d/dyosnap.repo", mode = "644", config = "noreplace" },
    { source = "linux/dyosnap-archive-keyring.asc", dest = "/etc/pki/rpm-gpg/RPM-GPG-KEY-dyosnap", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/licenses/dyosnap/LICENSE", mode = "644", doc = true },
    { source = "dist/linux/THIRD_PARTY_NOTICES.txt", dest = "/usr/share/doc/dyosnap/THIRD_PARTY_NOTICES.txt", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
# A file, so that Fedora's ffmpeg-free and RPM Fusion's ffmpeg both count.
"/usr/bin/ffmpeg" = "*"

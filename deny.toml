# cargo-deny: checks the crates in Cargo.lock. CI runs `cargo deny check` on every push and
# pull request, and the advisories check every Monday (audit.yml).
# It only sees Rust crates. FFmpeg is a separate program; scripts/build-ffmpeg.sh keeps it
# free of GPL and nonfree parts.

[graph]
# The platforms DyoSnap ships for. Crates only used on other platforms are skipped.
targets = [
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

[advisories]
# Known vulnerabilities always fail. Unmaintained crates only fail when DyoSnap depends on
# them directly; deeper in the tree we cannot replace them ourselves.
unmaintained = "workspace"

[licenses]
# Keep in sync with about.toml, which writes THIRD_PARTY_NOTICES.txt from the same list.
# No GPL or LGPL: the crates are linked into the MIT-licensed dyosnap binary.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unlicense",
]
confidence-threshold = 0.9
# The list is shared with about.toml; a license no crate uses right now is fine.
unused-allowed-license = "allow"
# DyoSnap itself (publish = false); its license is LICENSE.
private = { ignore = true }

[bans]
# Two versions of one crate happen through dependencies and are not worth failing for.
multiple-versions = "allow"
wildcards = "deny"

[sources]
# Crates only from crates.io, no git repositories or other registries.
unknown-registry = "deny"
unknown-git = "deny"

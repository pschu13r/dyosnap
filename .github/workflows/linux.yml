# Builds the Linux packages (.tar.gz, .deb and .rpm for x86_64 and arm64). Runs by hand and for every version
# tag; for a tag it also attaches the packages to that release, if it exists.
#
# The build runs third-party code (crate build scripts, cargo-about), so it only gets a
# read-only token, and the token is not left in .git/config. Only the small release job,
# which runs no project code, may write. Actions are pinned to a commit.
name: Linux

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang libclang-dev libpipewire-0.3-dev libspa-0.2-dev \
            libwayland-dev libxkbcommon-dev libdbus-1-dev dpkg-dev

      - name: Install Rust, cargo-about, cargo-deb and cargo-generate-rpm
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo install --locked --features cli cargo-about
          cargo install --locked cargo-deb cargo-generate-rpm

      - name: Test
        run: cargo test --locked

      - name: Build the package
        run: ./scripts/bundle-linux.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dyosnap-linux-${{ runner.arch }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: dyosnap-linux-*
          path: dist
          merge-multiple: true

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.deb dist/*.rpm --clobber
          else
            echo "No release $GITHUB_REF_NAME yet; the packages are in the run's artifacts."
          fi

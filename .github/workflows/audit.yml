# Security audit. Two checks:
#  - cargo-deny advisories: checks Cargo.lock against the RustSec advisory database and fails
#    on known vulnerabilities (rules in deny.toml). CI runs it on every push too; this weekly
#    run catches advisories published after the last push.
#  - ffmpeg: the macOS app bundles FFmpeg, which Dependabot cannot see. This opens an issue
#    when a newer FFmpeg release than the one in scripts/build-ffmpeg.sh exists.
# Runs when the FFmpeg build script changes, every Monday, and by hand.
# Like the other workflows it has a read-only token (the ffmpeg job may also write issues),
# does not keep it in .git/config, and pins actions to a commit.
name: Security audit

on:
  push:
    branches: [main]
    paths:
      - scripts/build-ffmpeg.sh
      - .github/workflows/audit.yml
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  advisories:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-deny@0.22.2

      - name: Check Cargo.lock for advisories
        run: cargo deny --locked check advisories

  ffmpeg:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # An available update is not a failure of this job, it only opens an issue.
      - name: Check for a newer FFmpeg release
        run: |
          old=$(sed -n 's/^VERSION=//p' scripts/build-ffmpeg.sh)
          new=$(git ls-remote --tags --refs https://git.ffmpeg.org/ffmpeg.git \
                  | sed 's#.*refs/tags/##' \
                  | grep -E '^n[0-9]+(\.[0-9]+)+$' | sed 's/^n//' | sort -V | tail -1)
          if [ -z "$old" ] || [ -z "$new" ]; then
            echo "::error::Could not read the FFmpeg versions (bundled: '$old', latest: '$new')."
            exit 1
          fi
          echo "Bundled: $old, latest: $new"
          if [ "$(printf '%s\n%s\n' "$old" "$new" | sort -V | tail -1)" = "$old" ]; then
            echo "FFmpeg is up to date."
            exit 0
          fi
          title="FFmpeg $new is out (bundled: $old)"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json title \
                       --jq "[.[] | select(.title == \"$title\")] | length")
          if [ "$existing" -gt 0 ]; then
            echo "Issue already open: $title"
            exit 0
          fi
          cat > body.md <<BODY
          The macOS app bundles FFmpeg $old. FFmpeg $new is out. Most FFmpeg point releases fix CVEs, so the bundled copy should follow.

          - Security fixes: https://ffmpeg.org/security.html
          - Release: https://ffmpeg.org/download.html

          To update:
          1. Bump \`VERSION\` in \`scripts/build-ffmpeg.sh\` to $new.
          2. Run the script. It checks the signature and prints the SHA256 to pin.
          3. Pin the SHA256 and rebuild the app.
          BODY
          gh issue create --title "$title" --body-file body.md

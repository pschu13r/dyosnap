name: Feature request
description: An idea that saves clicks or time.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        DyoSnap stays small on purpose: no account, no cloud, no network connections.
        Ideas that keep it simple and save clicks have the best chance.

  - type: textarea
    id: story
    attributes:
      label: What do you want to do?
      description: The task behind the idea. For example "As a support agent I want to blur a whole column, so that I can send screenshots of tables faster."
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: Your current workaround, and how many clicks or how much time it costs.

  - type: textarea
    id: proposal
    attributes:
      label: Your idea
      description: How it could work. A sketch or a screenshot from another tool helps.

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - macOS
        - Linux
